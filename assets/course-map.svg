<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans TC', 'Segoe UI', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="960" height="560" rx="16" fill="#0F172A"/>

  <text x="48" y="48" fill="#F8FAFC" font-size="22" font-weight="600">電腦圖學互動教學 · 課程地圖</text>
  <text x="48" y="74" fill="#94A3B8" font-size="13">完整 18 週課綱 · 每課含公式、Canvas 互動演示、比較表與小測驗</text>

  <!-- Pipeline stages as horizontal flow -->
  <text x="48" y="118" fill="#94A3B8" font-size="12" font-weight="500">沿管線由上而下：世界 → 幾何 → 變換 → 投影 → 像素</text>

  <!-- Weeks 1-3 -->
  <rect x="48" y="136" width="140" height="130" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="64" y="160" fill="#38BDF8" font-size="11" font-weight="600">W1–3</text>
  <text x="64" y="184" fill="#F8FAFC" font-size="13" font-weight="600">系統與程式</text>
  <text x="64" y="208" fill="#94A3B8" font-size="10">圖形系統與管線</text>
  <text x="64" y="224" fill="#94A3B8" font-size="10">圖形程式設計</text>
  <text x="64" y="248" fill="#38BDF8" font-size="10" font-weight="500">管線演示 · 可拖三角形</text>

  <!-- Weeks 4-5 -->
  <rect x="204" y="136" width="130" height="130" rx="10" fill="#1E293B" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="220" y="160" fill="#4ADE80" font-size="11" font-weight="600">W4–5</text>
  <text x="220" y="184" fill="#F8FAFC" font-size="13" font-weight="600">變換與檢視</text>
  <text x="220" y="208" fill="#94A3B8" font-size="10">2D SRT 實驗室</text>
  <text x="220" y="224" fill="#94A3B8" font-size="10">透視視錐 / FOV</text>
  <text x="220" y="248" fill="#4ADE80" font-size="10" font-weight="500">MVP 矩陣鏈</text>

  <!-- Weeks 6-8 -->
  <rect x="350" y="136" width="130" height="130" rx="10" fill="#1E293B" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="366" y="160" fill="#FBBF24" font-size="11" font-weight="600">W6–8</text>
  <text x="366" y="184" fill="#F8FAFC" font-size="13" font-weight="600">光照與著色</text>
  <text x="366" y="208" fill="#94A3B8" font-size="10">Phong / Blinn 球體</text>
  <text x="366" y="224" fill="#94A3B8" font-size="10">期中考</text>
  <text x="366" y="248" fill="#FBBF24" font-size="10" font-weight="500">可調光源參數</text>

  <!-- Weeks 9-11 -->
  <rect x="496" y="136" width="140" height="130" rx="10" fill="#1E293B" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="512" y="160" fill="#A78BFA" font-size="11" font-weight="600">W9–11</text>
  <text x="512" y="184" fill="#F8FAFC" font-size="13" font-weight="600">光柵化與離散</text>
  <text x="512" y="208" fill="#94A3B8" font-size="10">從頂點到像素</text>
  <text x="512" y="224" fill="#94A3B8" font-size="10">取樣 · 深度混合</text>
  <text x="512" y="248" fill="#A78BFA" font-size="10" font-weight="500">覆蓋率 · 取樣模式</text>

  <!-- Weeks 12-13 -->
  <rect x="652" y="136" width="130" height="130" rx="10" fill="#1E293B" stroke="#F472B6" stroke-width="1.5"/>
  <text x="668" y="160" fill="#F472B6" font-size="11" font-weight="600">W12–13</text>
  <text x="668" y="184" fill="#F8FAFC" font-size="13" font-weight="600">建模與階層</text>
  <text x="668" y="208" fill="#94A3B8" font-size="10">階層建模</text>
  <text x="668" y="224" fill="#94A3B8" font-size="10">二連桿機械臂</text>
  <text x="668" y="248" fill="#F472B6" font-size="10" font-weight="500">可拖關節</text>

  <!-- Weeks 14-18 -->
  <rect x="798" y="136" width="118" height="130" rx="10" fill="#1E293B" stroke="#2DD4BF" stroke-width="1.5"/>
  <text x="814" y="160" fill="#2DD4BF" font-size="11" font-weight="600">W14–18</text>
  <text x="814" y="184" fill="#F8FAFC" font-size="13" font-weight="600">程序式</text>
  <text x="814" y="204" fill="#F8FAFC" font-size="13" font-weight="600">與曲面</text>
  <text x="814" y="228" fill="#94A3B8" font-size="10">fBm 雜訊 · Bézier</text>
  <text x="814" y="248" fill="#2DD4BF" font-size="10" font-weight="500">期末考</text>

  <!-- Arrows -->
  <line x1="188" y1="201" x2="202" y2="201" stroke="#64748B" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="334" y1="201" x2="348" y2="201" stroke="#64748B" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="480" y1="201" x2="494" y2="201" stroke="#64748B" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="636" y1="201" x2="650" y2="201" stroke="#64748B" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="782" y1="201" x2="796" y2="201" stroke="#64748B" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Interactive demos grid -->
  <text x="48" y="310" fill="#F8FAFC" font-size="15" font-weight="600">互動演示（每課可拖參數）</text>

  <rect x="48" y="328" width="140" height="72" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="64" y="354" fill="#38BDF8" font-size="11" font-weight="600">管線階段</text>
  <text x="64" y="376" fill="#94A3B8" font-size="10">圖形系統演示</text>

  <rect x="204" y="328" width="130" height="72" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="220" y="354" fill="#4ADE80" font-size="11" font-weight="600">2D SRT</text>
  <text x="220" y="376" fill="#94A3B8" font-size="10">變換實驗室</text>

  <rect x="350" y="328" width="130" height="72" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="366" y="354" fill="#FBBF24" font-size="11" font-weight="600">Phong / Blinn</text>
  <text x="366" y="376" fill="#94A3B8" font-size="10">球體光照</text>

  <rect x="496" y="328" width="140" height="72" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="512" y="354" fill="#A78BFA" font-size="11" font-weight="600">光柵化覆蓋</text>
  <text x="512" y="376" fill="#94A3B8" font-size="10">頂點 → 像素</text>

  <rect x="652" y="328" width="130" height="72" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="668" y="354" fill="#F472B6" font-size="11" font-weight="600">機械臂</text>
  <text x="668" y="376" fill="#94A3B8" font-size="10">二連桿階層</text>

  <rect x="798" y="328" width="118" height="72" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="814" y="354" fill="#2DD4BF" font-size="11" font-weight="600">fBm · Bézier</text>
  <text x="814" y="376" fill="#94A3B8" font-size="10">雜訊 · 控制點</text>

  <!-- Suggested path -->
  <rect x="48" y="430" width="868" height="90" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="72" y="460" fill="#F8FAFC" font-size="13" font-weight="600">建議用法</text>
  <text x="72" y="484" fill="#94A3B8" font-size="12">1. 沿管線由上而下讀 W1–5　　2. 每個演示拖參數後，用 WebGL / three.js 重寫同一概念　　3. 考試週用小測驗暖身，手推一次 MVP 矩陣鏈</text>
  <text x="72" y="504" fill="#64748B" font-size="11">純 HTML / CSS / JS · 無需建置 · 適合 GitHub Pages 或本機 http.server · 進度存 localStorage</text>
</svg>
